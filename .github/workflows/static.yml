# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Isolate and prepare Godot web build
        run: |
          # Create a clean folder for deployment
          mkdir -p public_build
          
          # Copy everything from web-edition straight into the root of public_build
          cp -r web-edition/* public_build/
          
          # Debug: Verify index.html exists right here
          ls -la public_build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
